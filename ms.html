<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Quote Editor</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.maateen.me/solaiman-lipi/font.css" rel="stylesheet">
    <link href="https://fonts.maateen.me/charukola-ultra-light/font.css" rel="stylesheet">
    <link href="https://fonts.maateen.me/ben-sen/font.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Galada&family=Baloo+Da+2:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* --- 1. CLEAN THEME VARIABLES --- */
        :root {
            --primary: #2563eb;       /* Royal Blue */
            --primary-light: #eff6ff;
            --bg-page: #f3f4f6;       /* Light Gray */
            --bg-card: #ffffff;       /* Pure White */
            --text-dark: #1f2937;
            --text-gray: #6b7280;
            --border: #e5e7eb;
            --radius: 12px;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            background: var(--bg-page);
            color: var(--text-dark);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- 2. SIMPLE HEADER --- */
        header {
            background: var(--bg-card);
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 50;
        }

        .logo { font-family: 'Baloo Da 2'; font-weight: 700; font-size: 1.3rem; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        .reset-btn { color: var(--text-gray); cursor: pointer; font-size: 0.9rem; border: none; background: none; }

        /* --- 3. LAYOUT --- */
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Left: Image Preview */
        .preview-area {
            flex: 1.5;
            background: #e5e7eb;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            overflow: auto;
        }

        #canvas-card {
            width: 500px;
            height: 500px;
            background: white;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: 0.3s;
        }

        /* Responsive Canvas */
        @media (max-width: 800px) {
            .container { flex-direction: column; overflow: auto; }
            .preview-area { flex: none; height: 400px; padding: 20px; }
            #canvas-card { transform: scale(0.7); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        }

        /* Card Content Layers */
        .layer-bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
        .layer-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0); }
        .layer-text { 
            position: absolute; inset: 0; 
            display: flex; flex-direction: column; 
            justify-content: center; padding: 40px; 
            text-align: center;
        }

        #renderQuote { font-size: 32px; line-height: 1.4; font-weight: 600; margin-bottom: 20px; }
        #renderAuthor { font-size: 20px; font-weight: 400; opacity: 0.9; }
        .watermark { position: absolute; bottom: 20px; right: 20px; font-size: 12px; opacity: 0.6; text-transform: uppercase; letter-spacing: 1px; }

        /* --- 4. CONTROLS (RIGHT SIDE) --- */
        .editor-area {
            flex: 1;
            max-width: 400px;
            background: var(--bg-card);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        @media (max-width: 800px) { .editor-area { max-width: 100%; border-left: none; } }

        .editor-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        /* Form Styling */
        .section-title {
            font-size: 0.85rem; font-weight: 700; color: var(--text-gray); 
            text-transform: uppercase; margin: 20px 0 10px 0; letter-spacing: 0.5px;
        }
        .section-title:first-child { margin-top: 0; }

        textarea, input[type="text"], select {
            width: 100%; padding: 12px; border: 1px solid var(--border);
            border-radius: 8px; font-family: inherit; font-size: 1rem;
            margin-bottom: 10px; outline: none; background: #fff;
        }
        textarea:focus, input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }

        /* Custom Range Slider */
        input[type="range"] {
            width: 100%; margin: 10px 0; accent-color: var(--primary); cursor: pointer;
        }

        /* Color Options */
        .color-row { display: flex; gap: 10px; margin-bottom: 10px; overflow-x: auto; padding-bottom: 5px; }
        .color-btn {
            width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--border); cursor: pointer; flex-shrink: 0;
        }
        .color-btn.active { border-color: var(--text-dark); transform: scale(1.1); }

        /* Grid for BG */
        .bg-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 15px; }
        .bg-btn {
            aspect-ratio: 1; border-radius: 6px; cursor: pointer; border: 2px solid transparent; background-size: cover;
        }
        .bg-btn:hover { border-color: var(--primary); }

        /* Footer Button */
        .footer-area {
            padding: 20px; border-top: 1px solid var(--border);
        }
        .download-btn {
            width: 100%; padding: 14px; background: var(--primary); color: white;
            border: none; border-radius: 8px; font-size: 1rem; font-weight: 600;
            cursor: pointer; display: flex; justify-content: center; gap: 10px; align-items: center;
            transition: 0.2s;
        }
        .download-btn:active { transform: scale(0.98); }

        /* Hidden File Input */
        #imgUpload { display: none; }
        .upload-label {
            display: block; text-align: center; padding: 10px; border: 1px dashed var(--border);
            border-radius: 8px; cursor: pointer; color: var(--primary); font-weight: 600; margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fas fa-graduation-cap"></i> Academic School</div>
        <button class="reset-btn" onclick="location.reload()">Reset</button>
    </header>

    <div class="container">
        <div class="preview-area">
            <div id="canvas-card">
                <div class="layer-bg" id="bgLayer" style="background-color: #ffffff;"></div>
                <div class="layer-overlay" id="overlayLayer"></div>
                <div class="layer-text" id="textLayer">
                    <div id="renderQuote">শিক্ষা জাতির মেরুদণ্ড। শিক্ষা ছাড়া কোনো জাতি উন্নতি লাভ করতে পারে না।</div>
                    <div id="renderAuthor">সংগৃহীত</div>
                    <div class="watermark" id="renderWatermark">ACADEMIC SCHOOL</div>
                </div>
            </div>
        </div>

        <div class="editor-area">
            <div class="editor-scroll">
                
                <div class="section-title">লেখা পরিবর্তন করুন</div>
                <textarea id="inputQuote" rows="3" oninput="updateText()">শিক্ষা জাতির মেরুদণ্ড। শিক্ষা ছাড়া কোনো জাতি উন্নতি লাভ করতে পারে না।</textarea>
                <input type="text" id="inputAuthor" value="সংগৃহীত" oninput="updateText()" placeholder="লেখকের নাম">
                <input type="text" id="inputWatermark" value="Academic School" oninput="updateText()" placeholder="ওয়াটারমার্ক">

                <div class="section-title">ফন্ট ও স্টাইল</div>
                <select id="fontSelect" onchange="updateStyle()">
                    <option value="'Hind Siliguri', sans-serif">Hind Siliguri (Clean)</option>
                    <option value="'SolaimanLipi', sans-serif">SolaimanLipi (Classic)</option>
                    <option value="'Charukola Ultra Light', sans-serif">Charukola (Elegant)</option>
                    <option value="'Ben Sen', sans-serif">Ben Sen (Bold)</option>
                    <option value="'Galada', cursive">Galada (Script)</option>
                </select>

                <div style="display:flex; justify-content:space-between; font-size:0.8rem; color:var(--text-gray);">
                    <span>Text Size</span> <span id="sizeVal">32px</span>
                </div>
                <input type="range" id="sizeRange" min="18" max="60" value="32" oninput="updateStyle()">

                <div class="section-title">টেক্সট কালার</div>
                <div class="color-row">
                    <div class="color-btn" style="background:#1f2937" onclick="setColor('#1f2937')"></div>
                    <div class="color-btn" style="background:#ffffff; border:1px solid #ddd" onclick="setColor('#ffffff')"></div>
                    <div class="color-btn" style="background:#dc2626" onclick="setColor('#dc2626')"></div>
                    <div class="color-btn" style="background:#2563eb" onclick="setColor('#2563eb')"></div>
                    <div class="color-btn" style="background:#059669" onclick="setColor('#059669')"></div>
                    <div class="color-btn" style="background:#d97706" onclick="setColor('#d97706')"></div>
                </div>

                <div class="section-title">ব্যাকগ্রাউন্ড</div>
                <div class="bg-grid">
                    <div class="bg-btn" style="background:#fff; border:1px solid #ddd" onclick="setBg('color', '#ffffff')"></div>
                    <div class="bg-btn" style="background:#fef3c7" onclick="setBg('color', '#fef3c7')"></div>
                    <div class="bg-btn" style="background:#dbeafe" onclick="setBg('color', '#dbeafe')"></div>
                    <div class="bg-btn" style="background:linear-gradient(45deg, #6366f1, #ec4899)" onclick="setBg('grad', 'linear-gradient(45deg, #6366f1, #ec4899)')"></div>
                </div>

                <label for="imgUpload" class="upload-label"><i class="fas fa-cloud-upload-alt"></i> আপনার ছবি দিন</label>
                <input type="file" id="imgUpload" accept="image/*" onchange="uploadImage(this)">

                <div style="display:flex; justify-content:space-between; font-size:0.8rem; color:var(--text-gray); margin-top:10px;">
                    <span>Dark Overlay</span>
                </div>
                <input type="range" id="overlayRange" min="0" max="80" value="0" oninput="updateOverlay()">

            </div>

            <div class="footer-area">
                <button class="download-btn" onclick="downloadImage()">
                    <i class="fas fa-download"></i> ডাউনলোড (PNG)
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        // --- LOGIC ---
        const els = {
            quote: document.getElementById('renderQuote'),
            author: document.getElementById('renderAuthor'),
            watermark: document.getElementById('renderWatermark'),
            bg: document.getElementById('bgLayer'),
            card: document.getElementById('canvas-card'),
            textLayer: document.getElementById('textLayer')
        };

        // Text Updates
        function updateText() {
            els.quote.innerText = document.getElementById('inputQuote').value;
            els.author.innerText = document.getElementById('inputAuthor').value;
            els.watermark.innerText = document.getElementById('inputWatermark').value;
        }

        // Style Updates
        function updateStyle() {
            const font = document.getElementById('fontSelect').value;
            const size = document.getElementById('sizeRange').value;
            
            els.card.style.fontFamily = font;
            els.quote.style.fontSize = size + 'px';
            document.getElementById('sizeVal').innerText = size + 'px';
        }

        // Color Updates
        function setColor(color) {
            els.textLayer.style.color = color;
            els.watermark.style.color = color;
        }

        // Background Updates
        function setBg(type, val) {
            els.bg.style.backgroundImage = 'none';
            if(type === 'color') els.bg.style.backgroundColor = val;
            if(type === 'grad') els.bg.style.background = val;
        }

        function uploadImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    els.bg.style.backgroundImage = `url(${e.target.result})`;
                    els.bg.style.backgroundColor = 'transparent';
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function updateOverlay() {
            const val = document.getElementById('overlayRange').value / 100;
            document.getElementById('overlayLayer').style.backgroundColor = `rgba(0,0,0,${val})`;
        }

        // Download Logic
        async function downloadImage() {
            const btn = document.querySelector('.download-btn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
            
            try {
                const canvas = await html2canvas(els.card, {
                    scale: 3, // High Quality
                    useCORS: true,
                    backgroundColor: null
                });
                const link = document.createElement('a');
                link.download = `Academic_Quote_${Date.now()}.png`;
                link.href = canvas.toDataURL();
                link.click();
            } catch (error) {
                alert("Sorry, download failed.");
            } finally {
                btn.innerHTML = '<i class="fas fa-download"></i> ডাউনলোড (PNG)';
            }
        }
    </script>
</body>
</html>
