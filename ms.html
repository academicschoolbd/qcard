<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic School Quote Pro Max</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.maateen.me/solaiman-lipi/font.css" rel="stylesheet">
    <link href="https://fonts.maateen.me/charukola-ultra-light/font.css" rel="stylesheet">
    <link href="https://fonts.maateen.me/adorsho-lipi/font.css" rel="stylesheet">
    <link href="https://fonts.maateen.me/ben-sen/font.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@400;800&family=Galada&family=Hind+Siliguri:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #6366f1;
            --accent: #f43f5e;
            --bg-site: #0f172a;
            --bg-ui: #1e293b;
            --text-main: #f8fafc;
            --border: #334155;
            --radius-lg: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Hind Siliguri', sans-serif; background: var(--bg-site); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

        header { background: var(--bg-ui); padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); sticky; top: 0; z-index: 1000; }
        .logo { font-size: 1.4rem; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 10px; font-family: 'Baloo Da 2'; }

        main { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
        @media (min-width: 1024px) { main { flex-direction: row; } }

        /* PREVIEW AREA */
        .viewport { flex: 1; display: flex; justify-content: center; align-items: center; background: #000; padding: 20px; overflow: auto; position: relative; }
        #postcard { width: 500px; height: 500px; background: #fff; position: relative; overflow: hidden; box-shadow: 0 0 50px rgba(0,0,0,0.5); flex-shrink: 0; transition: transform 0.2s; }
        .bg-layer { position: absolute; inset: 0; background-size: cover; background-position: center; transition: filter 0.3s; }
        .overlay-layer { position: absolute; inset: 0; pointer-events: none; }
        .content-layer { position: relative; z-index: 10; width: 100%; height: 100%; display: flex; flex-direction: column; padding: 10%; justify-content: center; }
        .quote-wrap { margin-bottom: 20px; }
        .quote-text { display: inline; line-height: 1.4; word-wrap: break-word; white-space: pre-wrap; font-size: 28px; }
        .author-wrap { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; }
        .watermark { position: absolute; bottom: 15px; right: 20px; font-size: 11px; opacity: 0.5; color: inherit; display: none; text-transform: uppercase; letter-spacing: 1px; }

        /* SIDEBAR CONTROLS */
        .sidebar { flex: 0 0 420px; background: var(--bg-ui); border-left: 1px solid var(--border); display: flex; flex-direction: column; }
        @media (max-width: 1023px) { .sidebar { flex: none; width: 100%; border-left: none; border-top: 1px solid var(--border); } }

        .tabs { display: flex; background: #0f172a; border-bottom: 1px solid var(--border); }
        .tab-btn { flex: 1; padding: 14px; border: none; background: transparent; color: #94a3b8; font-weight: 700; cursor: pointer; transition: 0.2s; border-bottom: 3px solid transparent; font-size: 0.9rem; }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); background: rgba(99, 102, 241, 0.1); }

        .scroller { flex: 1; overflow-y: auto; padding: 20px; max-height: 60vh; }
        @media (min-width: 1024px) { .scroller { max-height: none; } }

        .control-group { margin-bottom: 22px; }
        label { display: block; font-size: 0.75rem; color: #94a3b8; margin-bottom: 8px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }

        textarea, input[type="text"], select { width: 100%; background: #0f172a; border: 1px solid var(--border); border-radius: 10px; padding: 12px; color: white; font-family: inherit; font-size: 0.95rem; }
        textarea:focus, input:focus, select:focus { border-color: var(--primary); outline: none; }

        .range-wrapper { display: flex; align-items: center; gap: 12px; margin-top: 5px; }
        input[type="range"] { flex: 1; accent-color: var(--primary); }
        .range-label { font-family: monospace; font-weight: bold; color: var(--primary); min-width: 35px; }

        .palette { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .swatch { background: #0f172a; border: 1px solid var(--border); padding: 10px; border-radius: 10px; display: flex; align-items: center; gap: 10px; }
        input[type="color"] { background: none; border: none; width: 28px; height: 28px; cursor: pointer; }

        .sidebar-footer { padding: 15px; background: #0f172a; display: grid; grid-template-columns: 1fr 2fr; gap: 12px; }
        .btn { padding: 14px; border-radius: 12px; border: none; font-weight: 800; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-reset { background: #334155; color: white; }
        .btn-main { background: var(--primary); color: white; font-size: 1rem; }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }
    </style>
</head>
<body>

<header>
    <div class="logo"><i class="fas fa-graduation-cap"></i> Academic School</div>
    <div style="font-size: 11px; color: #64748b; font-weight: bold;">GENERATOR PRO MAX</div>
</header>

<main>
    <div class="viewport">
        <div id="postcard">
            <div class="bg-layer" id="bgLayer"></div>
            <div class="overlay-layer" id="overlayLayer"></div>
            <div class="content-layer" id="contentLayer">
                <div class="quote-wrap">
                    <span id="qmStart" style="opacity: 0.7;">❝</span>
                    <div class="quote-text" id="quoteMain">ভুল কী জানেন? মূলত আমরা ভুল হিসেবে যেটুকু করে থাকি তা ছাড়া বাকিটুকুই ভুল, যা আমরা উপলব্ধি করি অনেক পরে।</div>
                    <span id="qmEnd" style="opacity: 0.7;">❞</span>
                </div>
                <div class="author-wrap" id="authorWrap">
                    <i class="fas fa-feather-alt" id="authorIcon"></i>
                    <span id="authorMain">আহমেদ আরমান</span>
                </div>
                <div class="watermark" id="brandWatermark">Academic School</div>
            </div>
        </div>
    </div>

    <aside class="sidebar">
        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('text')">লেখা</button>
            <button class="tab-btn" onclick="showTab('design')">ডিজাইন</button>
            <button class="tab-btn" onclick="showTab('fx')">ফিল্টার</button>
        </div>

        <div class="scroller">
            <div id="tab-text" class="tab-pane">
                <div class="control-group">
                    <label>উক্তি (Quote Content)</label>
                    <textarea id="inQuote" rows="4" oninput="refresh()">ভুল কী জানেন? মূলত আমরা ভুল হিসেবে যেটুকু করে থাকি তা ছাড়া বাকিটুকুই ভুল, যা আমরা উপলব্ধি করি অনেক পরে।</textarea>
                </div>
                <div class="control-group">
                    <label>লেখকের নাম</label>
                    <input type="text" id="inAuthor" value="আহমেদ আরমান" oninput="refresh()">
                </div>
                <div class="control-group">
                    <label>অ্যালাইনমেন্ট (Alignment)</label>
                    <select id="inAlign" onchange="refresh()">
                        <option value="center">মাঝখানে (Center)</option>
                        <option value="left">বামে (Left)</option>
                        <option value="right">ডানে (Right)</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>ব্র্যান্ড ওয়াটারমার্ক</label>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <input type="checkbox" id="inWatermark" onchange="refresh()" checked> 
                        <span style="font-size: 0.8rem; color: #94a3b8;">Academic School লোগো দেখান</span>
                    </div>
                </div>
            </div>

            <div id="tab-design" class="tab-pane" style="display: none;">
                <div class="control-group">
                    <label>ফন্ট ফ্যামিলি (Premium Fonts)</label>
                    <select id="inFont" onchange="refresh()">
                        <option value="'Charukola Ultra Light'">Charukola (চমৎকার)</option>
                        <option value="'Adorsho Lipi'">Adorsho Lipi (আধুনিক)</option>
                        <option value="'Ben Sen'">Ben Sen (বোল্ড)</option>
                        <option value="'SolaimanLipi'">SolaimanLipi (ক্লাসিক)</option>
                        <option value="'Galada'">Galada (ক্যালিগ্রাফি)</option>
                        <option value="'Hind Siliguri'">Hind Siliguri (স্ট্যান্ডার্ড)</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>ফন্ট সাইজ</label>
                    <div class="range-wrapper">
                        <input type="range" id="sizeRange" min="16" max="90" value="28" oninput="refresh()">
                        <span class="range-label" id="sizeVal">28</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>কালার প্যালেট</label>
                    <div class="palette">
                        <div class="swatch"><input type="color" id="colText" value="#1e293b" oninput="refresh()"> <span>লেখা</span></div>
                        <div class="swatch"><input type="color" id="colAuthor" value="#dc2626" oninput="refresh()"> <span>লেখক</span></div>
                    </div>
                </div>
            </div>

            <div id="tab-fx" class="tab-pane" style="display: none;">
                <div class="control-group">
                    <label>ব্যাকগ্রাউন্ড ইমেজ</label>
                    <input type="file" id="imgPicker" accept="image/*" onchange="uploadImg(this)">
                </div>
                <div class="control-group">
                    <label>ইমেজ ব্লার (Background Blur)</label>
                    <div class="range-wrapper">
                        <input type="range" id="blurRange" min="0" max="15" value="0" oninput="refresh()">
                        <span class="range-label" id="blurVal">0</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>অন্ধকার ভাব (Dark Overlay)</label>
                    <div class="range-wrapper">
                        <input type="range" id="darkRange" min="0" max="90" value="0" oninput="refresh()">
                        <span class="range-label" id="darkVal">0</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>কার্ডের আকার</label>
                    <select id="inShape" onchange="resizeCard()">
                        <option value="500x500">বর্গাকার (Square 1:1)</option>
                        <option value="400x640">স্টোরি (Portrait 9:16)</option>
                        <option value="640x360">ল্যান্ডস্কেপ (Wide 16:9)</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="sidebar-footer">
            <button class="btn btn-reset" onclick="location.reload()"><i class="fas fa-undo"></i></button>
            <button class="btn btn-main" onclick="exportCard()">
                <i class="fas fa-camera"></i> ডাউনলোড (High-Res)
            </button>
        </div>
    </aside>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
    function showTab(type) {
        document.querySelectorAll('.tab-pane').forEach(p => p.style.display = 'none');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + type).style.display = 'block';
        event.currentTarget.classList.add('active');
    }

    function refresh() {
        const quote = document.getElementById('inQuote').value;
        const author = document.getElementById('inAuthor').value;
        const align = document.getElementById('inAlign').value;
        const font = document.getElementById('inFont').value;
        const size = document.getElementById('sizeRange').value;
        const cText = document.getElementById('colText').value;
        const cAuth = document.getElementById('colAuthor').value;
        const blur = document.getElementById('blurRange').value;
        const dark = document.getElementById('darkRange').value / 100;
        const showWatermark = document.getElementById('inWatermark').checked;

        // Apply Text and Fonts
        document.getElementById('quoteMain').innerText = quote;
        document.getElementById('authorMain').innerText = author;
        document.getElementById('postcard').style.fontFamily = font;
        document.getElementById('quoteMain').style.fontSize = size + 'px';
        
        // Colors
        document.getElementById('quoteMain').style.color = cText;
        document.getElementById('qmStart').style.color = cText;
        document.getElementById('qmEnd').style.color = cText;
        document.getElementById('authorWrap').style.color = cAuth;

        // Layout
        const content = document.getElementById('contentLayer');
        content.style.textAlign = align;
        content.style.alignItems = align === 'center' ? 'center' : (align === 'left' ? 'flex-start' : 'flex-end');
        
        // FX
        document.getElementById('bgLayer').style.filter = `blur(${blur}px)`;
        document.getElementById('overlayLayer').style.background = `rgba(0,0,0,${dark})`;
        document.getElementById('brandWatermark').style.display = showWatermark ? 'block' : 'none';

        // Labels
        document.getElementById('sizeVal').innerText = size;
        document.getElementById('blurVal').innerText = blur;
        document.getElementById('darkVal').innerText = Math.round(dark * 100) + '%';
    }

    function uploadImg(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => {
                const bg = document.getElementById('bgLayer');
                bg.style.backgroundColor = 'transparent';
                bg.style.backgroundImage = `url(${e.target.result})`;
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function resizeCard() {
        const val = document.getElementById('inShape').value.split('x');
        const card = document.getElementById('postcard');
        card.style.width = val[0] + 'px';
        card.style.height = val[1] + 'px';
    }

    async function exportCard() {
        const btn = document.querySelector('.btn-main');
        const original = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> প্রসেসিং...';
        
        try {
            const canvas = await html2canvas(document.getElementById('postcard'), {
                scale: 3, // 3x Quality
                useCORS: true,
                allowTaint: false,
                backgroundColor: null
            });
            
            const link = document.createElement('a');
            link.download = `Academic_School_Quote_${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        } catch (e) {
            alert('ডাউনলোড ত্রুটি! দয়া করে আবার চেষ্টা করুন।');
        } finally {
            btn.innerHTML = original;
        }
    }

    // Initialize defaults
    window.onload = refresh;
</script>

</body>
</html>
