<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Academic School | QuoteGen Pro Max</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.maateen.me/solaiman-lipi/font.css" rel="stylesheet">
    <link href="https://fonts.maateen.me/charukola-ultra-light/font.css" rel="stylesheet">
    <link href="https://fonts.maateen.me/ben-sen/font.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@400;800&family=Hind+Siliguri:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #6366f1;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text: #f8fafc;
            --border: #334155;
            --safe-area-bottom: env(safe-area-inset-bottom);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Responsive Header */
        header {
            background: var(--bg-card);
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            z-index: 100;
        }

        .brand { font-family: 'Baloo Da 2'; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 8px; font-size: 1.2rem; }

        /* Main Responsive Container */
        main {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        @media (min-width: 1024px) {
            main { flex-direction: row; height: calc(100vh - 65px); overflow: hidden; }
        }

        /* --- STICKY PREVIEW FOR MOBILE --- */
        .preview-container {
            flex: 1;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: sticky; /* Keeps card visible on mobile while scrolling settings */
            top: 0;
            z-index: 50;
            min-height: 350px;
            background-image: radial-gradient(#334155 1px, transparent 1px);
            background-size: 20px 20px;
        }

        #postcard {
            width: 500px;
            height: 500px;
            background: #fff;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transform-origin: center;
        }

        /* Mobile Scaling Logic */
        @media (max-width: 600px) {
            #postcard { transform: scale(0.65); }
            .preview-container { min-height: 320px; padding: 0; }
        }

        .bg-layer { position: absolute; inset: 0; background-size: cover; background-position: center; transition: 0.3s; }
        .overlay { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
        
        .content {
            position: relative; z-index: 10; width: 100%; height: 100%;
            display: flex; flex-direction: column; padding: 10%; justify-content: center;
        }

        .quote-text { font-size: 30px; line-height: 1.5; white-space: pre-wrap; font-weight: 500; }
        .author-wrap { display: flex; align-items: center; gap: 10px; margin-top: 20px; font-weight: 700; font-size: 22px; }
        .watermark { position: absolute; bottom: 15px; right: 20px; font-size: 10px; opacity: 0.4; letter-spacing: 1px; }

        /* --- SETTINGS PANEL --- */
        .settings-panel {
            flex: 0 0 100%;
            background: var(--bg-card);
            display: flex;
            flex-direction: column;
            border-top: 1px solid var(--border);
        }

        @media (min-width: 1024px) {
            .settings-panel { flex: 0 0 400px; border-top: none; border-left: 1px solid var(--border); }
        }

        .tab-bar { display: flex; background: #0f172a; position: sticky; top: 0; z-index: 10; }
        .tab-btn { flex: 1; padding: 15px; border: none; background: transparent; color: #94a3b8; font-weight: bold; cursor: pointer; border-bottom: 3px solid transparent; }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); background: rgba(99, 102, 241, 0.1); }

        .settings-scroll { padding: 20px; overflow-y: auto; flex: 1; }
        .control-item { margin-bottom: 20px; }
        label { display: block; font-size: 0.75rem; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; font-weight: 800; }

        input, select, textarea { width: 100%; padding: 12px; background: #0f172a; border: 1px solid var(--border); border-radius: 8px; color: white; font-family: inherit; }

        /* Big Sliders for Mobile Fingers */
        input[type="range"] { height: 30px; -webkit-appearance: none; background: transparent; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; height: 24px; width: 24px; border-radius: 50%; background: var(--primary); cursor: pointer; margin-top: -8px; }
        input[type="range"]::-webkit-slider-runnable-track { width: 100%; height: 8px; background: var(--border); border-radius: 4px; }

        .footer { padding: 20px; background: #0f172a; display: flex; gap: 10px; padding-bottom: calc(20px + var(--safe-area-bottom)); }
        .btn { flex: 1; padding: 15px; border-radius: 12px; border: none; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-dl { background: var(--primary); color: white; }
    </style>
</head>
<body>

<header>
    <div class="brand"><i class="fas fa-feather-pointed"></i> Academic School</div>
    <div style="font-size: 10px; opacity: 0.6;">v3.5 MOBILE READY</div>
</header>

<main>
    <div class="preview-container">
        <div id="postcard">
            <div class="bg-layer" id="bgLayer"></div>
            <div class="overlay" id="overlayLayer"></div>
            <div class="content" id="contentLayer">
                <div id="quoteMain" class="quote-text">আপনার উক্তি এখানে লিখুন...</div>
                <div class="author-wrap" id="authorWrap">
                    <i class="fas fa-pen-nib"></i>
                    <span id="authorMain">লেখকের নাম</span>
                </div>
                <div class="watermark">ACADEMIC SCHOOL</div>
            </div>
        </div>
    </div>

    <aside class="settings-panel">
        <div class="tab-bar">
            <button class="tab-btn active" onclick="openTab('edit', this)">লেখা</button>
            <button class="tab-btn" onclick="openTab('design', this)">স্টাইল</button>
            <button class="tab-btn" onclick="openTab('image', this)">ছবি</button>
        </div>

        <div class="settings-scroll">
            <div id="tab-edit" class="tab-pane">
                <div class="control-item">
                    <label>উক্তি (Quote)</label>
                    <textarea id="inQuote" rows="3" oninput="draw()">সাফল্য মানেই শেষ নয়, ব্যর্থতা মানেই মৃত্যু নয়; আসল হলো এগিয়ে যাওয়ার সাহস ধরে রাখা।</textarea>
                </div>
                <div class="control-item">
                    <label>লেখক</label>
                    <input type="text" id="inAuthor" value="উইনস্টন চার্চিল" oninput="draw()">
                </div>
            </div>

            <div id="tab-design" class="tab-pane" style="display:none">
                <div class="control-item">
                    <label>ফন্ট নির্বাচন</label>
                    <select id="inFont" onchange="draw()">
                        <option value="'Charukola Ultra Light'">Charukola</option>
                        <option value="'Ben Sen'">Ben Sen (Bold)</option>
                        <option value="'SolaimanLipi'">SolaimanLipi</option>
                    </select>
                </div>
                <div class="control-item">
                    <label>সাইজ (Size)</label>
                    <input type="range" id="inSize" min="20" max="80" value="30" oninput="draw()">
                </div>
            </div>

            <div id="tab-image" class="tab-pane" style="display:none">
                <div class="control-item">
                    <label>ব্যাকগ্রাউন্ড ছবি</label>
                    <input type="file" accept="image/*" onchange="updateBg(this)">
                </div>
                <div class="control-item">
                    <label>অন্ধকার ভাব (Darkness)</label>
                    <input type="range" id="inDark" min="0" max="80" value="0" oninput="draw()">
                </div>
            </div>
        </div>

        <div class="footer">
            <button class="btn btn-dl" onclick="download()">
                <i class="fas fa-download"></i> ইমেজ সেভ করুন
            </button>
        </div>
    </aside>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
    function openTab(id, btn) {
        document.querySelectorAll('.tab-pane').forEach(p => p.style.display = 'none');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + id).style.display = 'block';
        btn.classList.add('active');
    }

    function draw() {
        const quote = document.getElementById('inQuote').value;
        const author = document.getElementById('inAuthor').value;
        const size = document.getElementById('inSize').value;
        const font = document.getElementById('inFont').value;
        const dark = document.getElementById('inDark').value / 100;

        document.getElementById('quoteMain').innerText = quote;
        document.getElementById('authorMain').innerText = author;
        document.getElementById('postcard').style.fontFamily = font;
        document.getElementById('quoteMain').style.fontSize = size + 'px';
        document.getElementById('overlayLayer').style.background = `rgba(0,0,0,${dark})`;
    }

    function updateBg(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => document.getElementById('bgLayer').style.backgroundImage = `url(${e.target.result})`;
            reader.readAsDataURL(input.files[0]);
        }
    }

    async function download() {
        const btn = document.querySelector('.btn-dl');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> প্রসেসিং...';
        
        // Reset scale for export to get full resolution
        const card = document.getElementById('postcard');
        const canvas = await html2canvas(card, { scale: 3, useCORS: true });
        
        const link = document.createElement('a');
        link.download = `Academic_School_${Date.now()}.png`;
        link.href = canvas.toDataURL();
        link.click();
        btn.innerHTML = '<i class="fas fa-download"></i> ইমেজ সেভ করুন';
    }

    window.onload = draw;
</script>

</body>
</html>
